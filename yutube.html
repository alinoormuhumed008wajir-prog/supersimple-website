<!DOCTYPE html>
<html>
<head>
    <title>Yutube.com Clone</title>
    <link rel="stylesheet" href=" styless/general.css">
     <link rel="stylesheet" href=" styless/header.css">
     <link rel="stylesheet" href="styless/video.css">
     <link rel="stylesheet" href="styless/sidebar.css">

    </head>
    
<body>
    <div class="header">
        <div class="left-section">
        <img class="hamburger-menu"
         src="icons/hamburger-menu.svg">
        <img class="youtube-logo"
         src="icons/youtube-logo.svg">
        </div>
        <div class="middle-section">
        <input class ="search-bar" type="text" placeholder="search">
        <button class="search-button">
            <img class="search-icon"
             src="icons/search.svg">
            <div class="tooltip"> search</div>
        </button>
        <button
         class="voice-search-button"> 
            <img src="icons/voice-search-icon.svg">
             <div class="tooltip"> search with you voice<div>
        </button>
        </div>
        <div class="right-section"> 
            <img class="upload"
             src="icons/upload.svg">
            <img class="youtube-apps"
             src="icons/youtube-apps.svg">
             <div class="notifications-container">
                 <img  class="notifications"
            src="icons/notifications.svg">
            <div class="notifications-count">3</div>
        </div>
            <img class=" my-channel-picture"
             src="icons/my-channel.jpeg">
        </div>
    </div>
    <div class="sidebar">
        <div class="sidebar-link">
            <img src="icons/home.svg">
            <div>home</div>
        </div>
        <div class="sidebar-link">
            <img src="icons/explore.svg">
            <div>explore</div>
        </div>
        <div class="sidebar-link">
            <img src="icons/subscriptions.svg">
            <div>subscriptions</div>
        </div>
        <div class="sidebar-link">
            <img src="icons/orig.svg">
            <div>orig</div>
        </div>
        <div class="sidebar-link">
            <img src="icons/youtb.svg">
            <div>youtb</div>
        </div>
        <div class="sidebar-link">
            <img src="icons/libra.svg">
            <div>libra</div>
        </div>
    </div>
    <div class="video-grid">
    <div class="video-preview">
        <div>
            <div class="thumbnail-row">
        
             <img class="thumbnail" src="thumbnails/thumbnail-1.webp">
             <div class="video-time"> 14:20</div>
        </div>
        <div class="channel-1.jpeg">
                <img class="profile-picture"
                src="channel-1.jpeg">
                </div>
                <div class="video-info-grid">
                <div class="channel-picture">

                </div>
            <div class="video-info">
            <div> 
            </div>
            </div>
        </div>
                <div class="video-tittle">
Talking Tech and AI with Google CEO Sundar Pichai!
</p>
<div class="video-author">
Marques Brownlee

</p>
<p class="video-stats">
    3.4M views  6 months ago
</p></div>
</body>
</html>
